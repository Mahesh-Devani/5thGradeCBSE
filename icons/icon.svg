<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="leftPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="rightPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <radialGradient id="badgeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.8" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="160" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />
  <circle cx="256" cy="240" r="110" fill="#8b5cf6" opacity="0.22" filter="url(#glow)" />

  <!-- Book Graphics -->
  <!-- Left Page -->
  <path d="M 256 340 L 76 295 L 76 195 L 256 230 Z" fill="url(#leftPage)" opacity="0.95" />
  <line x1="110" y1="218" x2="225" y2="242" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="110" y1="245" x2="225" y2="269" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="110" y1="272" x2="200" y2="291" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- Right Page -->
  <path d="M 256 340 L 436 295 L 436 195 L 256 230 Z" fill="url(#rightPage)" opacity="0.95" />
  <line x1="300" y1="242" x2="402" y2="218" stroke="#ddd6fe" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="300" y1="269" x2="402" y2="245" stroke="#ddd6fe" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="300" y1="291" x2="385" y2="272" stroke="#ddd6fe" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- Spine Ribbon -->
  <path d="M 250 225 L 256 220 L 262 225 L 262 360 L 256 354 L 250 360 Z" fill="#ec4899" />

  <!-- Central Badge "5" -->
  <circle cx="256" cy="155" r="54" fill="url(#badgeGrad)" stroke="#fef3c7" stroke-width="4" filter="url(#glow)" />
  <text x="256" y="177" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#0a0e1a" text-anchor="middle">5</text>

  <!-- Spark Star -->
  <path d="M 256 70 L 263 88 L 282 92 L 266 103 L 272 121 L 256 109 L 240 121 L 246 103 L 230 92 L 249 88 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Pill CBSE Text -->
  <rect x="176" y="380" width="160" height="52" rx="26" fill="#1e2946" stroke="#3b82f6" stroke-width="2.5" />
  <text x="256" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#f0f4ff" letter-spacing="4" text-anchor="middle">CBSE</text>
</svg>
